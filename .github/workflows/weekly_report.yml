name: 📊 Reporte Semanal de Correos & Tareas

on:
  schedule:
    # 17:00 UTC los viernes = 12:00 PM (Mediodía) Hora Colombia (UTC-5)
    - cron: '0 17 * * 5'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la interfaz de GitHub

# Evita ejecuciones simultáneas que podrían enviar el mismo reporte dos veces.
concurrency:
  group: weekly-email-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Configurar variables y credenciales
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python -c "
          import os, sys

          gemini_key = os.environ.get('GEMINI_API_KEY', '').strip()
          if not gemini_key:
              print('❌ Error: El secreto GEMINI_API_KEY está vacío en GitHub Secrets.', file=sys.stderr)
              sys.exit(1)

          creds = os.environ.get('GOOGLE_CREDENTIALS_JSON', '').strip()
          if not creds:
              print('❌ Error: El secreto GOOGLE_CREDENTIALS_JSON está vacío en GitHub Secrets.', file=sys.stderr)
              sys.exit(1)

          token = os.environ.get('GOOGLE_TOKEN_JSON', '').strip()
          if not token:
              print('❌ Error: El secreto GOOGLE_TOKEN_JSON está vacío en GitHub Secrets.', file=sys.stderr)
              sys.exit(1)

          with open('.env', 'w', encoding='utf-8') as f:
              f.write(f'GEMINI_API_KEY={gemini_key}\n')
              # Modelo principal; si no está disponible, ai_analyzer.py intentará
              # los demás de GEMINI_MODEL_OPTIONS en cascada automáticamente.
              f.write('GEMINI_MODEL=gemini-2.5-flash\n')
              f.write('USER_TIMEZONE=America/Bogota\n')
              f.write('REPORT_DAY=friday\n')
              f.write('REPORT_HOUR=12\n')
              f.write('REPORT_MINUTE=0\n')
              f.write('DAYS_BACK=7\n')

          with open('credentials.json', 'w', encoding='utf-8') as f:
              f.write(creds)

          with open('token.json', 'w', encoding='utf-8') as f:
              f.write(token)

          print('✅ Configuración de credenciales y variables completada con éxito.')
          "

      - name: 🚀 Ejecutar Agente Semanal y Enviar Reporte
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "false"
        run: |
          python agent.py run
